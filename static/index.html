<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storage Check</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/sheet.css">
<link rel="stylesheet" href="/static/css/dialog.css">
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="lang" role="group" data-i18n-aria-label="lang.switch">
      <button type="button" data-lang="th">TH</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <h1 data-i18n="hero.title"></h1>
    <p id="summary"></p>
    <div class="disk" id="disk" hidden>
      <div class="meter"><span id="meter"></span></div>
      <div class="meter-labels"><span id="used-label"></span><span id="free-label"></span></div>
      <p class="disk-note"><span aria-hidden="true">ⓘ</span> <span data-i18n="disk.note"></span></p>
    </div>
  </div>

  <div class="primary">
    <button class="btn big" id="scan-btn"></button>
  </div>

  <div class="cards" id="cards" hidden>
    <section class="card safe">
      <div class="icon">🧹</div>
      <h2 data-i18n="card.cache.title"></h2>
      <div class="size" id="cache-size">–</div>
      <p class="desc" data-i18n="card.cache.desc"></p>
      <button class="btn" id="cache-btn" data-i18n="card.cache.btn"></button>
    </section>

    <section class="card">
      <div class="icon">🎬</div>
      <h2 data-i18n="card.big.title"></h2>
      <div class="size" id="big-size">–</div>
      <p class="desc" data-i18n="card.big.desc"></p>
      <button class="btn" id="big-btn" data-i18n="card.big.btn"></button>
    </section>

    <section class="card">
      <div class="icon">🛠️</div>
      <h2 data-i18n="card.tools.title"></h2>
      <div class="size" id="tools-size" data-i18n="card.tools.size"></div>
      <p class="desc" data-i18n="card.tools.desc"></p>
      <button class="btn" id="tools-btn" data-i18n="card.tools.btn"></button>
    </section>

    <section class="card">
      <div class="icon">📑</div>
      <h2 data-i18n="card.dups.title"></h2>
      <div class="size" id="dups-size">–</div>
      <p class="desc" data-i18n="card.dups.desc"></p>
      <button class="btn" id="dups-btn" data-i18n="card.search_view"></button>
    </section>

    <section class="card">
      <div class="icon">🗂️</div>
      <h2 data-i18n="card.fdups.title"></h2>
      <div class="size" id="fdups-size">–</div>
      <p class="desc" data-i18n="card.fdups.desc"></p>
      <button class="btn" id="fdups-btn" data-i18n="card.search_view"></button>
    </section>
  </div>

  <details class="more" id="more">
    <summary data-i18n="more.summary"></summary>
    <div class="more-body">
      <h3 data-i18n="more.folders"></h3>
      <div id="folders"></div>

      <h3 class="spaced" data-i18n="more.compare"></h3>
      <div class="actions">
        <button class="btn quiet" id="report-btn" data-i18n="compare.save"></button>
        <button class="btn quiet" id="snap-pick" aria-haspopup="dialog"></button>
        <button class="btn quiet" id="snap-delete" data-i18n="compare.delete"></button>
        <button class="btn quiet" id="diff-btn" data-i18n="compare.diff"></button>
        <button class="btn quiet" id="weekly-btn" data-i18n="compare.weekly"></button>
      </div>
      <pre class="out" id="compare-out" hidden></pre>
      <div id="diff-out" hidden></div>

      <h3 class="spaced" data-i18n="more.settings"></h3>
      <div class="settings">
        <label><span data-i18n="settings.min_pre"></span> <input type="number" id="set-min" min="1" max="10240"> <span data-i18n="settings.unit_mb"></span></label>
        <label><span data-i18n="settings.dup_pre"></span> <input type="number" id="set-dup" min="1" max="10240"> <span data-i18n="settings.unit_mb"></span></label>
        <label><span data-i18n="settings.old_pre"></span> <input type="number" id="set-old" min="1" max="120"> <span data-i18n="settings.unit_months"></span></label>
        <div class="actions">
          <button class="btn quiet" id="set-save" data-i18n="settings.save"></button>
          <span class="note" id="set-msg"></span>
        </div>
      </div>

      <h3 class="spaced" data-i18n="more.excluded"></h3>
      <div id="excluded"></div>
    </div>
  </details>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <header>
      <h2 id="sheet-title"></h2>
      <p id="sheet-sub"></p>
    </header>
    <div class="toolbar" id="sheet-toolbar" hidden>
      <input type="search" id="sheet-search" data-i18n-placeholder="sheet.search">
      <button class="btn ghost" id="sheet-all" data-i18n="sheet.select_all"></button>
      <button class="btn ghost" id="sheet-csv" data-i18n="sheet.csv"></button>
    </div>
    <div class="chips" id="sheet-chips" hidden></div>
    <div class="list" id="sheet-list" hidden></div>
    <div class="text-body" id="sheet-text" hidden></div>
    <footer>
      <span class="sum" id="sheet-sum"></span>
      <div class="buttons">
        <button class="btn quiet" id="sheet-close" data-i18n="common.close"></button>
        <button class="btn danger" id="sheet-action" hidden></button>
      </div>
    </footer>
  </div>
</div>

<div class="busy" id="busy" hidden role="status" aria-live="polite">
  <span class="spinner"></span><span class="busy-text" id="busy-text"></span>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
